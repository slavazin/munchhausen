[project]
name = "munchhausen"
version = "0.1.0"
description = "A harness that admits only what the world confirms."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymongo>=4.13",          # AsyncMongoClient; imported only under munchhausen/store/
    "anthropic>=0.75",        # imported only under munchhausen/impl/
    "voyageai>=0.3",          # imported only under munchhausen/impl/
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
lens = ["typesafe-sdk"]       # LensPanel=jev
trace = ["raindrop-ai"]       # Trace=raindrop, SignalSource=raindrop

[project.scripts]
munchhausen = "munchhausen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["munchhausen"]
