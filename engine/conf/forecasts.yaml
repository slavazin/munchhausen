# Pre-registered forecasts (SPEC § 11). Written to runs.forecasts before the first episode of the run they
# govern; never edited after it. Run A is a pilot: if any knob moves before Run B, Run B's forecasts are
# re-registered at its start and the report lists every knob that moved (diff of runs.knobs).
#
# Comparisons between arms are paired (the arms share the stream by index): the reading is the mean paired
# difference with a bootstrap CI_LEVEL interval and its n. Verdict, three-way, against the stated margin m:
#   above  — the interval's lower bound > +m
#   below  — the interval's upper bound < −m
#   within — otherwise (the reading does not resolve the forecast at margin m)
# The report prints each forecast beside its reading, and a disagreement stands as a disagreement.
#
# `read` is the machine half (metrics/readings.py `read_forecast`): the reading kind and its parameters. Arm
# names live here, never in code. `drift` names a pack drift_schedule entry; its index comes from the knob
# the pack names (D1 → D1_AT). `quirk_prefix` matches pack quirk ids (Q1 → Q1_active_customer).
forecasts:
  F1:
    claim: an arm holding a pre-D1 Q1 decision shows a calibration gap over D1_AT…D1_AT+150 above its gap over the 150 episodes before D1_AT, until a successor is admitted
    reading: calibration gap (mean confidence − accuracy) after minus before, per arm; frozen with the stream on is the no-decision reference
    margin: 0.05
    unit: accuracy points (fraction)
    read: {kind: drift_calibration, drift: D1, quirk_prefix: Q1, reference: frozen}
  F2:
    claim: "sanity check, not a finding: governed admits 0 N1-derived decisions; naive admits ≥ 1"
    reading: planted_map N1-derived admitted count per arm
    margin: 0
    unit: decisions
    read: {kind: planted_count, quirk_prefix: N1, expect: {governed: {max: 0}, naive: {min: 1}}}
  F3:
    claim: naive holds P1 at org scope; governed holds it at persona scope or not at all
    reading: planted_map P1 scope per arm
    margin: 0
    unit: decisions
    read: {kind: planted_scope, quirk_prefix: P1, expect: {naive: [org], governed: [persona, none]}}
  F4:
    claim: governed drift-to-supersede latency for D1 is below naive's and below ungated's, where those arms resolve the drift at all
    reading: latency difference (other − governed); a single drift event per arm, so the verdict is the sign beyond the margin, with no interval
    margin: 30
    unit: episodes (one ROUND_SIZE)
    read: {kind: drift_latency, drift: D1, quirk_prefix: Q1, a: governed, others: [naive, ungated]}
  F5:
    claim: on quirk-bearing stream questions after round 10, governed accuracy is above naive's
    reading: paired difference governed − naive, same questions by index
    margin: 0.05
    unit: accuracy (fraction)
    read: {kind: paired_accuracy, a: governed, b: naive, population: quirk_bearing, after_round: 10}
  F6:
    claim: on quirk-bearing stream questions after round 10, governed accuracy is above ungated's (the gate's effect)
    reading: paired difference governed − ungated, same questions by index
    margin: 0.05
    unit: accuracy (fraction)
    read: {kind: paired_accuracy, a: governed, b: ungated, population: quirk_bearing, after_round: 10}
