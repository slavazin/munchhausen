[project]
name = "munchhausen-viewer"
version = "0.1.0"
description = "Presentation layer: FastAPI + SSE over the engine's Store port (SPEC § 17)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "munchhausen",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["munchhausen_viewer"]
